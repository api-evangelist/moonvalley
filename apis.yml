name: Moonvalley
description: 'Moonvalley is an AI research lab building Marey, a studio-grade generative video model for
  filmmakers. Marey generates cinematic image-to-video and text-to-video with precise creative controls
  — pose transfer, camera control, motion transfer, and trajectory control — and is trained exclusively
  on licensed data, which Moonvalley markets as a "commercially safe" model for professional production.
  Marey launched publicly in July 2025. A first-party public API is announced but currently waitlist-only;
  developers can run Marey today through inference partners fal.ai and ComfyUI. Backed by Bessemer Venture
  Partners and General Catalyst.'
